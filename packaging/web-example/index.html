<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MHGU hub</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<h1>MHGU hub</h1>
<div class="stats" id="stats"></div>
<table>
  <thead><tr><th>Room</th><th>Players</th><th>Quest</th><th>Password</th><th>Access</th><th>Status</th></tr></thead>
  <tbody id="rooms"><tr><td colspan="6">loading…</td></tr></tbody>
</table>
<p class="hint">This page is your own: replace the files in this directory (<code>-web-dir</code>) freely.
Data comes from <code>/api/hubs</code>.</p>
<script>
const zh = (navigator.language || '').startsWith('zh');
const T = { room: zh ? '房间' : 'Room', players: zh ? '玩家' : 'Players',
            quest: zh ? '任务' : 'Quest', password: zh ? '密码' : 'Password',
            unnamed: zh ? '未命名' : 'Unnamed', inQuest: zh ? '任务中' : 'In quest',
            hunterSearch: zh ? '猎人搜索' : 'Hunter search',
            access: zh ? '访问' : 'Access', status: zh ? '状态' : 'Status',
            pub: zh ? '公开' : 'Public', phone: zh ? '仅手机' : 'Phone only', key: zh ? 'Key 房间' : 'Key room',
            open: zh ? '可加入' : 'open', waiting: zh ? '等待中' : 'waiting',
            none: zh ? '当前没有房间。' : 'No rooms right now.', up: zh ? '运行' : 'up' };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names = h => (h.names || []).map(esc).join(', ');
const quest = h => h.hunter_search ? T.hunterSearch : h.quest_name ? esc(h.quest_name) : h.in_quest ? T.inQuest : '—';
const roomName = h => esc(h.room_name || T.unnamed);
const pass = h => h.passcode == null ? '—' : '#' + String(h.passcode).padStart(4, '0');
function access(h) {
  if (h.access === 'phone') return '📱 ' + T.phone;
  if (h.access === 'key' || h.locked) return '🔒 ' + T.key;
  return '🌐 ' + T.pub;
}
function tick() {
  fetch('/api/hubs').then(r => r.json()).then(v => {
    document.getElementById('stats').textContent =
      `${v.hubs.length} ${T.room} · ${v.players} ${T.players} · ${T.up} ${Math.floor(v.uptime / 60)}m`;
    const rows = v.hubs.map((h, i) => {
      const count = h.count || h.players, max = h.max || 4;
      return `<tr><td><b>${roomName(h)}</b><br><small>${T.room} ${i + 1} · link ${h.link}</small></td>` +
        `<td>${count}/${max}<br><small>${names(h)}</small></td>` +
        `<td>${quest(h)}</td><td>${pass(h)}</td><td>${access(h)}</td>` +
        `<td>${count > 1 ? T.open : T.waiting}</td></tr>`;
    }).join('');
    document.getElementById('rooms').innerHTML = rows || `<tr><td colspan="6">${T.none}</td></tr>`;
  }).catch(() => {});
}
tick(); setInterval(tick, 5000);
</script>
</body>
</html>
