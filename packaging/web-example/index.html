<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MHGU hub</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<h1>MHGU hub</h1>
<div class="stats" id="stats"></div>
<table>
  <thead><tr><th>Room</th><th>Players</th></tr></thead>
  <tbody id="rooms"><tr><td colspan="2">loading…</td></tr></tbody>
</table>
<p class="hint">This page is your own: replace the files in this directory (<code>-web-dir</code>) freely.
Data comes from <code>/api/hubs</code>.</p>
<script>
const zh = (navigator.language || '').startsWith('zh');
const T = { room: zh ? '房间' : 'Room', players: zh ? '玩家' : 'Players',
            none: zh ? '当前没有房间。' : 'No rooms right now.', up: zh ? '运行' : 'up' };
function tick() {
  fetch('/api/hubs').then(r => r.json()).then(v => {
    document.getElementById('stats').textContent =
      `${v.hubs.length} ${T.room} · ${v.players} ${T.players} · ${T.up} ${Math.floor(v.uptime / 60)}m`;
    const rows = v.hubs.map((h, i) =>
      `<tr><td>${T.room} ${i + 1}</td><td>${h.players}</td></tr>`).join('');
    document.getElementById('rooms').innerHTML = rows || `<tr><td colspan="2">${T.none}</td></tr>`;
  }).catch(() => {});
}
tick(); setInterval(tick, 5000);
</script>
</body>
</html>
