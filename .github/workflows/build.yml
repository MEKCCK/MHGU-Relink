name: Build Windows exe

# Windows only: Linux and Android are built locally. Manual runs, and a tag builds the Windows archive
# for a release page. The workflow only compiles; it never signs or uploads a keystore.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows exe
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make git diffutils python curl xz tar zip nasm binutils
            mingw-w64-ucrt-x86_64-clang mingw-w64-ucrt-x86_64-lld mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-rust mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-sdl3 mingw-w64-ucrt-x86_64-shaderc
            mingw-w64-ucrt-x86_64-vulkan-headers mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-vulkan-memory-allocator
      - name: Rust link and crossplay libraries
        shell: msys2 {0}
        run: cargo build --release --locked -p mhgu-link-ffi -p mhgu-crossplay
      - name: Fetch FFmpeg source (retry; ffmpeg.org resets connections sometimes)
        shell: msys2 {0}
        run: |
          mkdir -p third_party/ffmpeg
          for i in 1 2 3 4 5; do
            if curl -fL --retry 5 --retry-all-errors --retry-delay 2               -o third_party/ffmpeg/ffmpeg-9.0.2.tar.xz.part               https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz; then
              mv third_party/ffmpeg/ffmpeg-9.0.2.tar.xz.part third_party/ffmpeg/ffmpeg-9.0.2.tar.xz
              exit 0
            fi
            sleep $((i * 5))
          done
          exit 1
      - name: Runtime and DLL bundle
        shell: msys2 {0}
        run: make -j4 GEN=/nonexistent FFMPEG=bundled
      - name: Package
        shell: msys2 {0}
        run: |
          mkdir -p dist
          (cd build && zip -qr ../dist/mhgu-relink-windows-x86_64.zip \
            mhgu-relink.exe mhgu-relink-updater.exe *.dll licenses)
          sha256sum dist/mhgu-relink-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mhgu-relink-windows-x86_64
          path: dist/mhgu-relink-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mhgu-relink-import-lib
          path: obj/mhgu-relink.dll.a
