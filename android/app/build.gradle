plugins {
    id 'com.android.application'
}

// Las .so vienen ya compiladas de ../native/build_native.sh (jniLibs): Gradle solo empaqueta.
// (la clave de firma: ../keystore.properties, fuera de git; sin ese archivo no se puede firmar)
def signing = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace = "com.mhgu.recomp"
    compileSdk 35
    ndkVersion "27.0.12077973"
    defaultConfig {
        applicationId "com.mhgu.recomp"
        minSdk 28
        targetSdk 35
        versionCode 7
        versionName "0.1.6"
        ndk {
            abiFilters 'arm64-v8a'
            if (project.hasProperty('emu')) abiFilters 'x86_64'  // (dev_emu.sh: el emulador de la PC)
        }
    }
    signingConfigs {
        // firma propia del proyecto (android/mhgu.keystore, fuera de git)
        local {
            storeFile file('../mhgu.keystore')
            storePassword signing['storePassword']
            keyAlias signing['keyAlias']
            keyPassword signing['keyPassword']
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingFile.exists()) signingConfig signingConfigs.local
        }
        debug {
            if (signingFile.exists()) signingConfig signingConfigs.local
        }
    }
    packagingOptions {
        jniLibs {
            // libmhgugame.so es enorme: extraída al instalar (dlopen por ruta) y sin comprimir dentro del APK no hace falta
            useLegacyPackaging = true
            // This build always includes the supplied game library, byte-for-byte.
            keepDebugSymbols += ['**/libmhgugame.so']
            // (Gradle quita la info de depuración: los símbolos dinámicos y .eh_frame quedan para los backtraces)
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}

dependencies {
    implementation 'com.github.junrar:junrar:8.1.2'
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.17'
}

def validateBundledGame = tasks.register('validateBundledGame') {
    def gameLibrary = file('src/main/jniLibs/arm64-v8a/libmhgugame.so')
    def bundledId = file('src/main/assets/libmhgugame.id')
    def runtimeId = file('src/main/assets/gamelib_id.txt')
    inputs.files(gameLibrary, bundledId, runtimeId)
    doLast {
        if (!gameLibrary.isFile() || !bundledId.isFile() || !runtimeId.isFile()) {
            throw new GradleException('The bundled libmhgugame.so and its ID files are required.')
        }
        def expected = bundledId.getText('UTF-8').trim()
        if (!(expected ==~ /[0-9a-f]{16}/) || expected != runtimeId.getText('UTF-8').trim()) {
            throw new GradleException('The bundled game library ID does not match this runtime. Rebuild compatible game code.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn(validateBundledGame) }
