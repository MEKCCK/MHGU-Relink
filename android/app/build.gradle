plugins {
    id 'com.android.application'
}

// Las .so vienen ya compiladas de ../native/build_native.sh (jniLibs): Gradle solo empaqueta.
// (la clave de firma: ../keystore.properties, fuera de git; sin ese archivo no se puede firmar)
def signing = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace = "com.mhgu.relink"
    compileSdk 35
    ndkVersion "27.0.12077973"
    defaultConfig {
        applicationId "com.mhgu.relink"
        minSdk 28
        targetSdk 35
        versionCode 8
        versionName "0.1.6"
        ndk {
            abiFilters 'arm64-v8a'
            if (project.hasProperty('emu')) abiFilters 'x86_64'  // (dev_emu.sh: el emulador de la PC)
        }
    }
    signingConfigs {
        // The project's own key (android/mhgu.keystore, out of git). `storeFile` in keystore.properties points at
        // a copy kept outside the repository (~/.config/mhgu-signing), so the key survives clean checkouts and
        // every build is signed with the same certificate (Android refuses to update an app signed with another).
        local {
            storeFile file(signing['storeFile'] ?: '../mhgu.keystore')
            storePassword signing['storePassword']
            keyAlias signing['keyAlias']
            keyPassword signing['keyPassword']
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingFile.exists()) signingConfig signingConfigs.local
        }
        debug {
            if (signingFile.exists()) signingConfig signingConfigs.local
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            excludes += ['**/libmhgugame.so']
            // The player supplies game code in the selected folder.
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}

dependencies {
    implementation 'com.github.junrar:junrar:8.1.2'
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.17'
}
